<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — на главную">
      <picture>
        <source srcset="{{ '/assets/img/logo.webp' | relative_url }}" type="image/webp">
        <img class="brand-logo" src="{{ '/assets/img/logo.png' | relative_url }}" alt="" width="30" height="30" decoding="async">
      </picture>
      <span class="brand-text">{{ site.title }}</span>
    </a>

    <form class="search" role="search" action="{{ '/search/' | relative_url }}" method="get" data-search-form>
      <input class="search-input" type="search" name="q" placeholder="Поиск по энциклопедии" aria-label="Поиск по энциклопедии" autocomplete="off" spellcheck="false" enterkeyhint="search" data-search-input>
      <button class="search-btn" type="submit" aria-label="Найти">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <div class="search-suggest" data-search-suggest hidden></div>
    </form>

    <nav class="main-nav" id="main-nav" aria-label="Основное меню">
      <a href="{{ '/categories/' | relative_url }}">Категории</a>
      <a href="{{ '/articles/' | relative_url }}">Все статьи</a>
      <a href="{{ '/random/' | relative_url }}" data-random>Случайная статья</a>
    </nav>

    <button class="icon-btn" type="button" data-theme-toggle aria-label="Переключить тему" title="Тёмная / светлая тема">
      <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn menu-btn" type="button" data-menu-toggle aria-expanded="false" aria-controls="main-nav" aria-label="Меню">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>
