# Червепедия - Энциклопедия Черветреда
title: "Червепедия"
description: "Энциклопедия Черветреда — тут ты узнаешь всю правду"

# ←←← ИСПРАВЛЕНО: теперь sitemap будет с полными адресами
url: "https://cherwepedia.github.io"
baseurl: ""

# Permalink structure
permalink: /:categories/:title/

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..3

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .same
  - googlebf448b4455c8f07b.html   # ← убираем верификационный файл Google из sitemap

# Plugins (GitHub Pages compatible)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
